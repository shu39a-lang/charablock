<script>

try{best=+localStorage.getItem('cb_best')||0}catch(e){}
$('bs').textContent=best;let dex={c:{}};try{const d=JSON.parse(localStorage.getItem('cb_dex'));if(d&&d.c)dex=d}catch(e){}const tr={};CHARS.forEach(v=>tr[v]=tierOf(v));

function account(set,kind,chain){

 if(bd){boss.hp-=bd;if(boss.hp<=0){const bb=1000*level();score+=bb;gauge=100;gaugeUI();boss=null;ui();setTimeout(()=>{msg('👹 ボス撃破! +'+bb);say(5,'やったー!');[523,659,784,1047].forEach((f,i)=>snd(f,.2,'triangle',.12,i*.12))},700)}bossUI()}
 for(const v of CHARS){const t=tierOf(v);if(t>(tr[v]||0)){tr[v]=t;setTimeout(()=>{say(v,'いしょうゲット!');msg('🎀 '+NAMES[v]+'の新衣装!')},1500)}}

 if(mis.p>=mis.n){const b=300*level();score+=b;mdone++;setTimeout(()=>{msg('ミッション達成! +'+b);say(5,'ミッションクリア!');[660,880,1100].forEach((f,i)=>snd(f,.15,'triangle',.12,i*.1))},700);newMission()}else msUI()}

async function rampage(){
 if(gauge<100||busy||!cur||over)return;
 let by=-1,bc=0;for(let y=0;y<H;y++){const n=grid[y].filter(v=>v!==null).length;if(n>0&&n>=bc){bc=n;by=y}}
 if(by<0)return;

async function wind(){const d=Math.random()<.5?-1:1;msg(d<0?'← 強風!':'強風! →');say(CHARS[rnd(pool())],'強風だー!');snd(220,.5,'triangle',.06);await sleep(600);
 for(let y=0;y<H;y++){const r=grid[y].filter(v=>v!==null),e=Array(W-r.length).fill(null);grid[y]=d<0?r.concat(e):e.concat(r)}
 gravity();draw();await sleep(300)}
let ac,mute=false,boss=null,wasDanger=false,sayT,lastTh=0,bgOn=true,bgT=null,bgStep=0,bgNext=0,voiceOn=true,spk=false,spkBusy=false;const parts=[];
const MEL=[72,0,76,79,76,0,72,0,69,0,72,76,72,0,69,0,65,0,69,72,69,0,65,0,67,0,71,74,79,0,74,0],ROOT=[48,45,41,43];

function bgPlay(){if(!ac||!bgOn||mute||!running)return;try{if(bgNext<ac.currentTime)bgNext=ac.currentTime+.05;const sp=Math.max(.17,.25-(level()-1)*.012);while(bgNext<ac.currentTime+.4){const i=bgStep%32,m=MEL[i],r=ROOT[Math.floor(i/8)];if(m)note(mf(m),bgNext,.24,'triangle',.05);if(i%4===0)note(mf(r),bgNext,.5,'sine',.07);if(i%8===4)note(mf(r+7),bgNext,.3,'sine',.035);bgNext+=sp;bgStep++}}catch(e){}}

function bgStop(){clearInterval(bgT);bgT=null}
let sa;function unlockAudio(){try{if(!spk&&!spkBusy&&window.speechSynthesis){spkBusy=true;const u=new SpeechSynthesisUtterance('あ');u.lang='ja-JP';u.volume=.02;u.onstart=()=>{spk=true};u.onend=u.onerror=()=>{spkBusy=false};speechSynthesis.speak(u);setTimeout(()=>{spkBusy=false},1500);speechSynthesis.getVoices()}}catch(e){}if(ac&&ac.state==='running'&&sa)return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0)}catch(e){}try{if(!sa){const n=800,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);b.fill(128,44);sa=new Audio('data:audio/wav;base64,'+btoa(String.fromCharCode(...b)));sa.loop=true;sa.play().catch(()=>{})}}catch(e){}}
function snd(f,d=.12,type='sine',v=.12,t0=0){if(mute||!f)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function speak(t,v){if(mute||!voiceOn)return;const P=[1.6,1.3,.9,1.9,2,.7,1.1,1.4,1,.5][v]||1.2,nh=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.speak;if(nh){nh.postMessage({t:t.replace(/[〜…]/g,''),p:P});return}if(!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t.replace(/[〜…]/g,''));u.lang='ja-JP';const jv=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith('ja'));if(jv)u.voice=jv;u.pitch=[1.6,1.3,.9,1.9,2,.7,1.1,1.4,1,.5][v]||1.2;u.rate=1.1;u.volume=1;const go=()=>speechSynthesis.speak(u);if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80)}else go()}catch(e){}}

function spawnParts(i,v){const x=(i%W)*C+C/2,y=Math.floor(i/W)*C+C/2;for(let k=0;k<6;k++){const a=Math.random()*6.28,s=60+Math.random()*140;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:1,col:COLORS[v%10]})}}

function tierOf(v){const n=dex.c[v]||0;return n>=250?3:n>=100?2:n>=30?1:0}

function gravity(){
  let moved=false;
  for(let x=0;x<W;x++){let w=H-1;for(let y=H-1;y>=0;y--)if(grid[y][x]!==null){if(w!==y){grid[w][x]=grid[y][x];grid[y][x]=null;moved=true}w--}}
  return moved;
}
async function resolve(){
  let chain=0;
  while(true){
    if(gravity()){draw();await sleep(100)}
    const set=new Set();let pts=0,kind='grp';
    // 金: 自分と上下左右に触れているブロックを全消去
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]===5){
      set.add(y*W+x);
      for(const[dx,dy]of D){const X=x+dx,Y=y+dy;if(X>=0&&X<W&&Y>=0&&Y<H&&grid[Y][X]!==null)set.add(Y*W+X)}
    }
    if(set.size){pts=set.size*20;kind='gold'}
    else{
      const seen=new Set();
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const v=grid[y][x];if(v===null||v>=8||seen.has(y*W+x))continue;
        const grp=[y*W+x];seen.add(y*W+x);
        for(let i=0;i<grp.length;i++){const cx=grp[i]%W,cy=Math.floor(grp[i]/W);
          for(const[dx,dy]of D){const X=cx+dx,Y=cy+dy;if(X>=0&&X<W&&Y>=0&&Y<H&&grid[Y][X]===v&&!seen.has(Y*W+X)){seen.add(Y*W+X);grp.push(Y*W+X)}}}
        if(grp.length>=MIN){grp.forEach(i=>set.add(i));pts+=grp.length*grp.length*5}
      }
    }
    if(!set.size){for(let y=0;y<H-1;y++)for(let x=0;x<W;x++){const a=grid[y][x],b=grid[y+1][x];if(a!==null&&b!==null&&a<5&&b<5&&PREY[a]===b)set.add((y+1)*W+x)}if(set.size){kind='eat';pts=set.size*15}}
    if(!set.size)break;
    chain++;pts*=chain;account(set,kind,chain);extra(set);fx(set,kind,chain);
    flash=[...set];draw();
    if(chain>=2){const el=$('chain');el.textContent=chain+'連鎖!';clearTimeout(chainT);chainT=setTimeout(()=>el.textContent='',900)}
    await sleep(280);
    for(const i of set)grid[Math.floor(i/W)][i%W]=null;
    flash=[];score+=pts;cleared+=set.size;ui();draw();await sleep(100);
  }
}
