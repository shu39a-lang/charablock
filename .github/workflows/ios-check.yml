name: キャラブロック iOS 動作検査
"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios_check:
    runs-on: macos-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Check game JavaScript syntax
        run: |
          python3 - <<'PYCODE'
          import pathlib, re
          html = pathlib.Path('Resources/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          assert scripts, 'Game JavaScript missing'
          pathlib.Path('/tmp/charablock-script.js').write_text('\n'.join(scripts))
          PYCODE
          node --check /tmp/charablock-script.js

      - name: Build iOS simulator app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project CharaBlock.xcodeproj \
            -scheme CharaBlock -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
